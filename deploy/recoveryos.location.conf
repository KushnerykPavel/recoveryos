# Add these locations inside the existing valkirie-shield.xyz HTTPS server.
# The proxy network resolves recoveryos-nginx after the Compose stack starts.
location = /recoveryos {
    return 308 /recoveryos/;
}

location /recoveryos/ {
    set $upstream http://recoveryos-nginx:80;
    rewrite ^/recoveryos/(.*)$ /$1 break;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy.conf;
}

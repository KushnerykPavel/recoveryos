server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recoveryos.valkirie-shield.xyz;

    ssl_certificate     /etc/letsencrypt/live/recoveryos.valkirie-shield.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recoveryos.valkirie-shield.xyz/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    location / {
        set $upstream http://recoveryos-nginx:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

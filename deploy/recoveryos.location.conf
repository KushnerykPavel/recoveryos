# Legacy path redirects from the apex host to the dedicated demo hostname.
# Keep these locations inside the existing valkirie-shield.xyz HTTPS server.
location = /recoveryos {
    return 308 https://recoveryos.valkirie-shield.xyz/;
}

location ~ ^/recoveryos/(.*)$ {
    return 308 https://recoveryos.valkirie-shield.xyz/$1$is_args$args;
}
